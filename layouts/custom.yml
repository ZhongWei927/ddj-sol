size: { width: 1200, height: 630 }
layers:
  - background:
      image: layouts/demo.png
      color: "#0007"
  
  - size: { width: 600, height: 200 }
    offset: { x: 100, y: 40 }
    typography:
      content: "ddj-sol" 
      align: start
      color: white
      line:
        amount: 1
      font:
        # family: Lavishly Yours
        family: Birthstone
        style: Bold
  
  - size: { width: 400, height: 6 }
    offset: { x: 100, y: 245 }
    background:
      color: "#ffffff"

  - size: { width: 900, height: 200 }
    offset: { x: 100, y: 260 }
    typography:
      content: "{{ page.title }}" 
      align: start
      color: white
      line:
        amount: 1
      font:
        # family: LXGW WenKai TC
        # family: Noto Serif TC
        family: Cactus Classical Serif
        style: Bold